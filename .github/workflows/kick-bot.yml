name: Kick Bot

on:
  workflow_dispatch:
    inputs:
      stream:
        description: 'URL del stream'
        required: true
        default: 'https://kick.com/canal'
      viewers:
        description: 'Cantidad de viewers'
        required: true
        default: '50'
      duration:
        description: 'Minutos a correr (max 360 = 6h)'
        required: true
        default: '60'

env:
  STREAM_URL: ${{ github.event.inputs.stream || 'https://kick.com/canal' }}
  VIEWERS: ${{ github.event.inputs.viewers || '50' }}
  DURATION: ${{ github.event.inputs.duration || '60' }}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 370

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install fastapi uvicorn curl-cffi
          npm install ws

      - name: Iniciar Token Server
        run: |
          python token_server_vps.py &
          sleep 3
          curl -s http://127.0.0.1:8765/health

      - name: Ejecutar bot
        run: |
          echo "Stream: $STREAM_URL | Viewers: $VIEWERS | Duración: $DURATION min"
          timeout $((DURATION * 60)) node kick-websocket-v14-tor.js "$STREAM_URL" "$VIEWERS" || true
