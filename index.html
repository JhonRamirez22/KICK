<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kick Viewer Bot UI - v2.0 Vercel Ready</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; color: #fff; }
        .container { max-width: 900px; margin: 0 auto; background: rgba(0,0,0,0.8); border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        h1 { text-align: center; margin-bottom: 30px; font-size: 2.5em; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .inputs { display: grid; grid-template-columns: 1fr 1fr auto; gap: 20px; margin-bottom: 30px; align-items: end; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 0.9em; opacity: 0.9; font-weight: 500; }
        input { 
            padding: 15px 20px; font-size: 1.1em; border: 2px solid transparent; 
            border-radius: 12px; background: rgba(255,255,255,0.12); color: #fff; 
            backdrop-filter: blur(15px); transition: all 0.3s ease; font-weight: 400;
        }
        input:focus { outline: none; border-color: #feca57; box-shadow: 0 0 0 3px rgba(254,202,87,0.2); background: rgba(255,255,255,0.18); }
        input::placeholder { color: #aaa; opacity: 0.8; }
        .button-group { display: flex; gap: 10px; flex-direction: column; }
        button { 
            padding: 18px 35px; font-size: 1.1em; border: none; border-radius: 12px; 
            background: linear-gradient(45deg, #ff6b6b, #feca57); color: white; cursor: pointer; 
            transition: all 0.3s; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; 
            box-shadow: 0 4px 15px rgba(255,107,107,0.3); min-height: 65px;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 10px 20px rgba(255,107,107,0.4); }
        button:disabled { background: #666; cursor: not-allowed; transform: none; }
        .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; text-align: center; backdrop-filter: blur(10px); }
        .stat-value { font-size: 2em; font-weight: bold; color: #feca57; margin-bottom: 5px; }
        .stat-label { font-size: 0.9em; opacity: 0.8; }
        #logs { height: 300px; background: rgba(0,0,0,0.4); border-radius: 10px; padding: 15px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 0.9em; line-height: 1.4; }
        .log-entry { margin-bottom: 5px; }
        .error { color: #ff6b6b; }
        .success { color: #51cf66; }
        .info { color: #74c0fc; }
        .warning { color: #feca57; }
        @media (max-width: 768px) { .inputs { grid-template-columns: 1fr; gap: 15px; } h1 { font-size: 2em; } .button-group { flex-direction: row; } button { font-size: 1em; padding: 15px 25px; flex: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Kick Viewer Bot UI v2.0</h1>
        <p style="text-align: center; margin-bottom: 20px; opacity: 0.8;">Basado en kick-websocket.js | <strong>Vercel Proxy Tokens</strong> | 100% Funcional</p>
        
        <div class="inputs">
            <div class="input-group">
                <label for="channelInput">Canal Kick:</label>
                <input type="text" id="channelInput" placeholder="maggiepepe" value="maggiepepe">
            </div>
            <div class="input-group">
                <label for="viewersInput">Viewers:</label>
                <input type="number" id="viewersInput" placeholder="500" value="500" min="1" max="2000">
            </div>
            <div class="button-group">
                <button id="startBtn">🚀 Lanzar Viewers</button>
                <button id="stopBtn" disabled>🛑 Stop</button>
            </div>
        </div>
        
        <div class="status-grid" id="statusGrid" style="display: none;">
            <div class="stat"><div class="stat-value" id="connected">0</div><div class="stat-label">Viewer WS</div></div>
            <div class="stat"><div class="stat-value" id="pusher">0</div><div class="stat-label">Pusher WS</div></div>
            <div class="stat"><div class="stat-value" id="tokens">0</div><div class="stat-label">Tokens Pool</div></div>
            <div class="stat"><div class="stat-value" id="uptime">--:--</div><div class="stat-label">Uptime</div></div>
            <div class="stat"><div class="stat-value" id="channelId">--</div><div class="stat-label">Channel ID</div></div>
            <div class="stat"><div class="stat-value" id="status">Listo</div><div class="stat-label">Estado</div></div>
        </div>
        
        <div id="logs"></div>
    </div>

    <script>
        // Polyfills
        if (!crypto.randomUUID) {
            crypto.randomUUID = () => 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0; 
                return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16); 
            });
        }

        class KickViewerBotVercel {
            constructor() {
                this.channel = '';
                this.count = 0;
                this.channelId = null;
                this.sockets = [];
                this.tokens = [];
                this.startTime = 0;
                this.state = { connected: 0, pusher: 0, tokens: 0 };
                this.running = false;
                
                this.init();
            }
            
            init() {
                document.getElementById('startBtn').onclick = () => this.launch();
                document.getElementById('stopBtn').onclick = () => this.kill();
            }
            
            log(msg, type = 'info') {
                const logs = document.getElementById('logs');
                const div = document.createElement('div');
                div.className = `log-entry ${type}`;
                div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
                logs.appendChild(div);
                logs.scrollTop = logs.scrollHeight;
            }
            
            async channelInfo() {
                try {
                    this.log('🔍 Canal info...', 'info');
                    const res = await fetch(`https://kick.com/api/v1/channels/${this.channel}`, {
                        headers: { 'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36' }
                    });
                    const data = await res.json();
                    
                    if (data.livestream) {
                        this.channelId = data.id;
                        this.log(`✅ Live: ${data.livestream.viewers} viewers | ID: ${this.channelId}`, 'success');
                        return true;
                    }
                    this.log('❌ No live stream', 'error');
                    return false;
                } catch (e) {
                    this.log(`❌ API fail: ${e.message}`, 'error');
                    return false;
                }
            }
            
            async tokens(n = 50) {
                try {
                    this.log(`📥 ${n} tokens...`, 'info');
                    const res = await fetch(`/api/tokens?channel=${this.channel}&count=${n}`);
                    const data = await res.json();
                    
                    if (data.tokens?.length) {
                        this.tokens.push(...data.tokens);
                        this.state.tokens += data.tokens.length;
                        this.log(`✅ ${data.count}/${n} tokens OK`, 'success');
                        return true;
                    }
                    this.log('❌ 0 tokens', 'error');
                    return false;
                } catch (e) {
                    this.log(`❌ Tokens API: ${e.message}`, 'error');
                    return false;
                }
            }
            
            launch() {
                this.channel = document.getElementById('channelInput').value.trim();
                this.count = parseInt(document.getElementById('viewersInput').value) || 100;
                
                if (!this.channel) return alert('Canal requerido');
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                document.getElementById('statusGrid').style.display = 'grid';
                this.running = true;
                this.startTime = Date.now();
                
                this.log('🚀 Kick Bot v2.0 INICIADO', 'success');
                
                this.channelInfo().then(ok => {
                    if (!ok) return this.kill();
                    this.tokens(this.count).then(ok => {
                        if (!ok) return this.kill();
                        for (let i = 0; i < Math.min(this.count, this.tokens.length); i++) {
                            setTimeout(() => {
                                if (this.running && this.tokens[i]) {
                                    this.wsConnect(i, this.tokens[i]);
                                }
                            }, i * 150);
                        }
                        this.autoRefresh();
                        this.dashboard();
                    });
                });
            }
            
            wsConnect(id, token) {
                const ws = new WebSocket(`wss://websockets.kick.com/viewer/v1/connect?token=${token}`);
                
                ws.onopen = () => {
                    this.state.connected++;
                    this.sockets.push(ws);
                    ws.send(JSON.stringify({ type: 'channel_handshake', data: { message: { channelId: this.channelId } } }));
                };
                
                ws.onclose = () => {
                    this.state.connected--;
                    this.sockets = this.sockets.filter(s => s !== ws);
                    // Reconnect logic
                };
                
                // Pusher
                const pws = new WebSocket('wss://ws-us2.pusher.com/app/32cbd69e4b950bf97679?protocol=7&client=js&version=8.4.0');
                pws.onopen = () => this.state.pusher++;
                this.sockets.push(pws);
            }
            
            autoRefresh() {
                this.tokenRefreshInterval = setInterval(() => this.tokens(25), 5*60*1000);
            }
            
            dashboard() {
                this.dashboardInterval = setInterval(() => {
                    document.getElementById('connected').textContent = this.state.connected;
                    document.getElementById('pusher').textContent = this.state.pusher;
                    document.getElementById('tokens').textContent = this.tokens.length;
                    document.getElementById('uptime').textContent = new Date().toISOString().substr(11,5);
                    document.getElementById('channelId').textContent = this.channelId || '--';
                    document.getElementById('status').textContent = this.running ? '🟢 LIVE' : '🔴 STOP';
                }, 2000);
            }
            
            kill() {
                this.running = false;
                this.sockets.forEach(ws => ws.close());
                clearInterval(this.tokenRefreshInterval);
                clearInterval(this.dashboardInterval);
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                this.log('🛑 Bot detenido', 'warning');
            }
        }
        
        new KickViewerBotVercel();
    </script>
</body>
</html>
